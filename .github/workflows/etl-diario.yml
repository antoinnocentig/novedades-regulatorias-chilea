name: ETL diario — Mercado Eléctrico

# Actualización automática diaria del dataset. Si se configura DATABASE_URL
# (secret) apunta a PostgreSQL gestionado; en caso contrario, persiste el
# SQLite resultante como artefacto y lo commitea de vuelta al repo.
on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC ≈ 05:00/06:00 Chile
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar ETL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # opcional (PostgreSQL)
        run: python scripts/run_etl.py

      - name: Persistir SQLite (si no hay PostgreSQL)
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          git config user.name "etl-bot"
          git config user.email "etl-bot@users.noreply.github.com"
          git add -f data/energia.db || true
          git commit -m "chore(etl): actualización automática $(date -u +%F)" || echo "Sin cambios"
          git push || echo "Nada que empujar"

      - name: Publicar artefacto de datos
        uses: actions/upload-artifact@v4
        with:
          name: energia-db
          path: data/
          if-no-files-found: ignore
